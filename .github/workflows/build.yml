name: build

# Builds every preset on each push and pull request and uploads the binaries as workflow artifacts; the newest
# build of main is also kept as the rolling "latest" release. Nothing here runs the game (no GPU, no assets).

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    # A stock ubuntu:24.04 container: the runner image's preinstalled amd64 -dev packages block libsdl2-dev:i386.
    container: ubuntu:24.04
    # Container jobs default to sh; the steps use bash features.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: native
            packages: gcc-multilib g++-multilib libsdl2-dev:i386 libgl-dev:i386
          - preset: native64
            packages: libsdl2-dev libgl-dev
    steps:
      - name: Base tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake make g++ pkg-config python3

      - uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          dpkg --add-architecture i386
          apt-get update
          apt-get install -y --no-install-recommends ${{ matrix.packages }}

      # FetchContent clones into the build directory; the key changes when a pin does.
      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        working-directory: Source

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)
        working-directory: Source

      # BUILD_STATIC: no engine .so beside the executable (system libraries stay dynamic).
      - name: Check it is one binary
        run: |
          test -x build-${{ matrix.preset }}/Game/Game
          test -x build-${{ matrix.preset }}/UCC/ucc-bin
          if ls build-${{ matrix.preset }}/*/*.so >/dev/null 2>&1; then
            echo "::error::engine .so modules were produced: BUILD_STATIC is not in effect"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hp2-${{ matrix.preset }}
          path: |
            build-${{ matrix.preset }}/Game/Game
            build-${{ matrix.preset }}/Game/libopenal.so.1
            build-${{ matrix.preset }}/UCC/ucc-bin
          if-no-files-found: error
          # Short retention keeps the artifact quota free; the `latest` job keeps the newest build.
          retention-days: 7

  windows:
    name: windows (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows
            objdump: i686-w64-mingw32-objdump
          - preset: windows64
            objdump: x86_64-w64-mingw32-objdump
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.preset }}/_deps
          key: deps-${{ matrix.preset }}-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        working-directory: Source

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)
        working-directory: Source

      # The exe must run outside the build machine: only system DLLs, plus the OpenAL32.dll copied beside it.
      - name: Check the exe imports only system DLLs
        run: |
          set -euo pipefail
          imports=$(${{ matrix.objdump }} -p build-${{ matrix.preset }}/Game/Game.exe | sed -n 's/^\tDLL Name: //p' | sort -u)
          echo "$imports"
          bad=$(echo "$imports" | grep -viE '^(ADVAPI32|GDI32|IMM32|KERNEL32|msvcrt|ole32|OLEAUT32|OPENGL32|OpenAL32|SETUPAPI|SHELL32|USER32|VERSION|WINMM|WS2_32)\.dll$' || true)
          if [ -n "$bad" ]; then echo "::error::non-system DLL imports: $bad"; exit 1; fi
          test -f build-${{ matrix.preset }}/Game/OpenAL32.dll

      - uses: actions/upload-artifact@v4
        with:
          name: hp2-${{ matrix.preset }}
          path: |
            build-${{ matrix.preset }}/Game/Game.exe
            build-${{ matrix.preset }}/Game/OpenAL32.dll
          if-no-files-found: error
          retention-days: 7

  web:
    name: web (wasm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # emcc must be on PATH before the configure step; the preset's toolchain file reads $EMSDK.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7
          actions-cache-folder: emsdk-cache

      # A fresh emsdk has no SDL2 port headers until the port is built.
      - name: Build the SDL2 port into the emsdk sysroot
        run: embuilder build sdl2

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build-wasm/_deps
          key: deps-wasm-${{ hashFiles('Source/CMakeLists.txt', 'Source/*/CMakeLists.txt', 'Source/cmake/*.cmake') }}

      # No game assets needed: the link preloads only the tracked web inis (Config/System/web).
      - name: Configure
        run: cmake --preset wasm
        working-directory: Source

      - name: Build
        run: cmake --build --preset wasm -j$(nproc)
        working-directory: Source

      # meta.json records the commit it was configured from; it must be the commit built.
      - name: Check artifact provenance
        run: |
          set -euo pipefail
          sha=$(python3 -c "import json;print(json.load(open('build-wasm/SDLLaunch/meta.json'))['provenance']['gitSha'])")
          echo "meta.json gitSha=$sha  HEAD=$GITHUB_SHA"
          case "$GITHUB_SHA" in "$sha"*) ;; *) echo "::error::meta.json gitSha does not match HEAD"; exit 1;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: hp2-web
          path: build-wasm/SDLLaunch/
          if-no-files-found: error
          retention-days: 7

  android:
    name: android (arm64 APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # JDK 17: the Gradle daemon's (Android/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Only platform-tools: the action's default list names `tools`, which the current SDK repository does not
      # have. The NDK and CMake come from the next step.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The NDK and the CMake the Gradle plugin asks for; the NDK version matches app/build.gradle's ndkVersion,
      # because AGP silently downloads its own on a mismatch. CI writes its own local.properties for this
      # runner's SDK.
      - name: Install the NDK + CMake and point the build at this runner's SDK
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;4.1.2" >/dev/null
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/28.2.13676358\n' "$ANDROID_HOME" "$ANDROID_HOME" > Android/local.properties

      # The Gradle project's default ABI set (arm64-v8a; -Pabis= adds the emulator's x86_64). The app's identity
      # follows HP2_TARGET_ID, so the retail branch builds its own app from the same project.
      - name: Build the APK
        run: ./gradlew assembleDebug --console=plain
        working-directory: Android

      - name: Assert the ABI is packaged
        run: |
          set -euo pipefail
          apk=Android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libHP2.so" || { echo "::error::missing arm64-v8a"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: hp2-android
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # The newest build of main as a release: release assets do not expire, workflow artifacts do. The release is
  # deleted and recreated so its tag moves to the new commit and retired builds drop out.
  latest:
    name: rolling "latest" release
    needs: [linux, windows, web, android]
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    # The default workflow token is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack one zip per build
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          n=0
          for d in artifacts/*/; do
            name=$(basename "$d")
            ( cd "$d" && zip -qr "$GITHUB_WORKSPACE/out/$name.zip" . )
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no artifacts were downloaded: nothing to publish"; exit 1; }
          ls -la out/

      - name: Publish (replacing the previous one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "latest — $(git log -1 --format=%s | cut -c1-72)" \
            --notes "$(printf '%s\n' \
              "The newest HP2 engine build of \`main\`, replaced on every push." \
              "" \
              "Commit: \`$GITHUB_SHA\`" \
              "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
