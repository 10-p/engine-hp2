; ============================================================================
; ufront 2.12 - render-device options exposed for tuning (defaults from source).
; NOTE (web / ES_WEBGL): on the web OpenGLVersion is force-set to ES_WEBGL at
; runtime, so that value is ignored here. Features WebGL2 cannot do (bindless
; textures, persistent/mapped buffers, SSBO draw-params) are auto-disabled in
; code - you do NOT need to toggle them here. UseAA=False bypasses the MSAA FBO.
; ============================================================================
[XOpenGLDrv.XOpenGLRenderDevice]
HighDetailActors=True
OpenGLVersion=ES_WEBGL
Coronas=True
VolumetricLighting=True
VolumetricLightingMeshes=True
ShinySurfaces=True
DetailTextures=True
UseVSync=Adaptive
RefreshRate=0
NumAASamples=4
DetailMax=3
GammaOffsetScreenshots=0.7
LODBias=0.0
MaxAnisotropy=16.0
GammaMultiplier=1.75
GammaMultiplierUED=1.75
NoFiltering=False
ShareLists=True
AlwaysMipmap=False
UsePrecache=True
UseTrilinear=True
UseAA=True
GammaCorrectScreenshots=True
MacroTextures=True
BumpMaps=True
ParallaxVersion=Disabled
NoAATiles=True
GenerateMipMaps=False
OneXBlending=True
ActorXBlending=True
UseSRGBTextures=False
SimulateMultiPass=False
DebugLevel=2
UseOpenGLDebug=False
NoDrawComplexSurface=False
NoDrawGouraud=False
NoDrawTile=False
NoDrawSimple=False
UseBufferInvalidation=False
UseAASmoothing=False
FrameRateLimit=0
UseHWLighting=False
UseHWClipping=False
UseEnhancedLightmaps=False
UseMeshBuffering=False
