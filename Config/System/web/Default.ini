; HP2 web Default.ini -- the ONLY web configuration (preloaded at /System/Default.ini; appInit("Game")
; derives /System/Game.ini from it on first boot). Derived from HP2's retail Config/System/Default.ini;
; see Config/System/web/README.md and docs/porting/analysis/web-layer-template.md section 9.2 for every key.
; Rules: exactly six Paths= lines with ../Save/*.usa LAST (appInit rewrites the last Paths= of Game.ini
; with the save-slot path); on-disk file case; no CdPath; UT99/Windows sections omitted.

[URL]
Protocol=unreal
ProtocolDescription=Unreal Protocol
Name=Player
Map=autoplay.unr
LocalMap=startup.unr
Host=
Portal=
MapExt=unr
SaveExt=usa
Port=7777
Class=Engine.Playerpawn

[FirstRun]
FirstRun=0

[Engine.Engine]
; Read by the launcher main loop (the frontend writes it with -ini:System:[Engine.Engine]:FrameRateCap=<n>).
FrameRateCap=120
GameRenderDevice=XOpenGLDrv.XOpenGLRenderDevice
; NOpenALDrv (HP2's ALAudio on openal-soft, PLAN Phase E); the launcher forces the same value.
AudioDevice=NOpenALDrv.NOpenALAudioSubsystem
NetworkDevice=WebRTCDrv.WebRTCNetDriver
DemoRecordingDevice=Engine.DemoRecDriver
;Console=UWindow.WindowConsole
Console=HGame.HPConsole
Language=int
GameEngine=Engine.GameEngine
EditorEngine=Editor.EditorEngine
WindowedRenderDevice=SoftDrv.SoftwareRenderDevice
RenderDevice=SoftDrv.SoftwareRenderDevice
DefaultGame=Engine.GameInfo
DefaultServerGame=Engine.GameInfo
ViewportManager=NSDLDrv.NSDLClient
Render=Render.Render
Input=Engine.Input
Canvas=Engine.Canvas

[Core.System]
PurgeCacheDays=30
SavePath=../Save
CachePath=../Cache
CacheExt=.uxx
Paths=../System/*.u
Paths=../Maps/*.unr
Paths=../Textures/*.utx
Paths=../Sounds/*.uax
Paths=../Music/*.umx
Paths=../Save/*.usa
Suppress=DevLoad
Suppress=DevSave
Suppress=DevNetTraffic
Suppress=DevGarbage
Suppress=DevKill
Suppress=DevReplace
Suppress=DevSound
Suppress=DevCompile
Suppress=DevBind
Suppress=DevBsp
;Suppress=ScriptLog
Suppress=ScriptWarning
;Suppress=Log
Suppress=Localization

[Engine.GameEngine]
CacheSizeMegs=4
UseSound=True

[Engine.Player]
ConfiguredInternetSpeed=2600
ConfiguredLanSpeed=20000

; appInit sizes the stream table from Channels whatever the audio driver is.
[ALAudio.ALAudioSubsystem]
UseEAX=False
CompatibilityMode=False
UsePrecache=False
ReverseStereo=False
Channels=32
MusicVolume=0.5
SoundVolume=0.9
DopplerFactor=1.0
RollOff=1.0

; The audio driver. ALAudio's keys with FLOAT volumes 0..1 (HGame's options page reads and writes them through
; ini:Engine.Engine.AudioDevice and scales by 100) + the template's OutputRate/UseHRTF/UseReverb; the frontend's
; headphone toggle writes UseHRTF on the command line. Retail had no reverb (EAX compiled out): UseReverb=False.
[NOpenALDrv.NOpenALAudioSubsystem]
UsePrecache=False
ReverseStereo=False
Channels=32
MusicVolume=0.5
SoundVolume=0.9
DopplerFactor=1.0
RollOff=1.0
Use3dHardware=False
OutputRate=44100
UseHRTF=False
UseReverb=False

[IpDrv.TcpNetDriver]
AllowDownloads=True
ConnectionTimeout=15.0
InitialConnectTimeout=300.0
AckTimeout=1.0
KeepAliveTime=0.2
MaxClientRate=20000
SimLatency=0
RelevantTimeout=5.0
SpawnPrioritySeconds=1.0
ServerTravelPause=4.0
NetServerMaxTickRate=20
LanServerMaxTickRate=35
DownloadManagers=Engine.ChannelDownload

[WebRTCDrv.WebRTCNetDriver]
