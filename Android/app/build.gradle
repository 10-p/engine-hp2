plugins { id 'com.android.application' }

// SDL2: one checkout for both halves of SDL, the C library the engine's CMakeLists builds (handed to it as
// FETCHCONTENT_SOURCE_DIR_SDL2) and the Java classes of SDLActivity (its android-project sources), so the
// two always match. -Psdl2Dir=<dir> (or SDL2_SOURCE_DIR) takes a local checkout; without one the SDL2 branch
// is cloned once into Android/build/SDL2.
def sdl2Branch = 'release-2.32.x'
def sdl2Given = project.findProperty('sdl2Dir') ?: System.getenv('SDL2_SOURCE_DIR')
def sdl2Dir = file(sdl2Given ?: "${rootDir}/build/SDL2")
def sdl2Java = new File(sdl2Dir, 'android-project/app/src/main/java')
if (!new File(sdl2Java, 'org/libsdl/app/SDLActivity.java').isFile()) {
    if (sdl2Given)
        throw new GradleException("sdl2Dir=${sdl2Dir} is not an SDL2 checkout (no android-project/app/src/main/java)")
    logger.lifecycle("Fetching SDL2 (${sdl2Branch}) into ${sdl2Dir}")
    sdl2Dir.parentFile.mkdirs()
    def git = ['git', 'clone', '--depth', '1', '-b', sdl2Branch, 'https://github.com/libsdl-org/SDL.git', sdl2Dir.path].execute()
    git.waitForProcessOutput(System.out, System.err)
    if (git.exitValue() != 0)
        throw new GradleException("could not clone SDL2 into ${sdl2Dir}")
}

// The frontend target this branch builds, HP2_TARGET_ID in Source/CMakeLists.txt: hp2-proto on main (the
// prototype content), hp2-retail-exp on retail (the retail disc's). The two apps install side by side: the
// retail one takes an applicationId suffix, its own label and its own game folder, and the Java package
// (the namespace, the JNI names) stays the same.
def cmakeRoot = file("${rootDir}/../Source/CMakeLists.txt")
def targetMatch = (cmakeRoot.text =~ /set\(HP2_TARGET_ID\s+"([^"]+)"\)/)
if (!targetMatch.find())
    throw new GradleException("no set(HP2_TARGET_ID \"...\") in ${cmakeRoot}")
def hp2Target = targetMatch.group(1)
def hp2Retail = hp2Target != 'hp2-proto'
def hp2AppName = hp2Retail ? 'HP2 Retail' : 'HP2 Prototype'
def hp2GameFolder = hp2Retail ? 'HP2-Retail' : 'HP2'
logger.lifecycle("HP2 target ${hp2Target}: \"${hp2AppName}\", game folder ${hp2GameFolder}")

// The ABIs of every APK: 32-bit and 64-bit ARM devices, and x86_64 (x86 Chromebooks, the emulator).
def hp2Abis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']

// What the APK installs into the game folder's System/ before each start (GameActivity): the Android inis
// of Config/System/android, those of them that exist.
abstract class Hp2SystemOverlay extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.NAME_ONLY) abstract ConfigurableFileCollection getIniFiles()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @TaskAction void run() {
        def out = new File(outputDir.get().asFile, 'system')
        out.deleteDir()
        out.mkdirs()
        iniFiles.files.findAll { it.isFile() }.each { ini ->
            java.nio.file.Files.copy(ini.toPath(), new File(out, ini.name).toPath())
        }
    }
}
def hp2SystemOverlay = tasks.register('hp2SystemOverlay', Hp2SystemOverlay) {
    def configDir = "${rootDir}/../Config/System/android"
    iniFiles.from(file("${configDir}/Default.ini"), file("${configDir}/DefUser.ini"))
    outputDir.set(layout.buildDirectory.dir('generated/hp2/assets'))
}

// Signing: ueAndroidSigning (a Gradle property, e.g. in ~/.gradle/gradle.properties) or UE_ANDROID_SIGNING names a
// properties file kept outside the repository with storeFile, storePassword, keyAlias and keyPassword. With it every
// variant is signed with that key, so each new APK installs over the last; without it, with the debug key.
def ueSigningPath = project.findProperty('ueAndroidSigning') ?: System.getenv('UE_ANDROID_SIGNING')
def ueSigning = null
if (ueSigningPath) {
    def signingFile = file(ueSigningPath)
    if (!signingFile.isFile())
        throw new GradleException("ueAndroidSigning=${ueSigningPath} is not a file")
    ueSigning = new Properties()
    signingFile.withInputStream { ueSigning.load(it) }
}

android {
    namespace = 'com.hp2.android'
    // Android 16, what the phones run; the app keeps Android 14's behaviour (targetSdk).
    compileSdk = 36
    // Ubuntu's google-android-ndk-r28c-installer, also AGP's default.
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = hp2Retail ? 'com.hp2.android.retail' : 'com.hp2.android'
        // Android 7: All files access is asked for from Android 11, the storage permission before.
        minSdk = 24
        targetSdk = 34
        versionCode = 10100
        versionName = '1.1.0'
        resValue 'string', 'app_name', hp2AppName
        buildConfigField 'String', 'TARGET_ID', "\"${hp2Target}\""
        buildConfigField 'String', 'GAME_FOLDER', "\"${hp2GameFolder}\""
        ndk { abiFilters.addAll(hp2Abis) }
        externalNativeBuild {
            cmake {
                abiFilters.addAll(hp2Abis)
                def cmakeArgs = [
                    '-DANDROID_STL=c++_shared',
                    // One libHP2.so: the engine's packages, openal-soft, libogg and libvorbis linked in.
                    '-DBUILD_STATIC=ON',
                    "-DFETCHCONTENT_SOURCE_DIR_SDL2=${sdl2Dir}".toString(),
                ]
                // -PxopenglDir=<path>: a local XOpenGLDrv clone instead of the fetched branch, as the other presets
                // take FETCHCONTENT_SOURCE_DIR_XOPENGLDRV.
                def xopenglDir = project.findProperty('xopenglDir')
                if (xopenglDir)
                    cmakeArgs += "-DFETCHCONTENT_SOURCE_DIR_XOPENGLDRV=${file(xopenglDir)}".toString()
                // The engine optimised in every variant (the Gradle debug variant would build it at -O0);
                // -PnativeDebug keeps the variant's own CMAKE_BUILD_TYPE.
                if (!project.hasProperty('nativeDebug'))
                    cmakeArgs += '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
                arguments.addAll(cmakeArgs)
                // libHP2.so (the Game launcher) with libSDL2.so, and the process set-up bridge.
                targets.addAll(['Game', 'hp2_android_bridge'])
            }
        }
    }

    signingConfigs {
        if (ueSigning) {
            release {
                storeFile = file(ueSigning.getProperty('storeFile'))
                storePassword = ueSigning.getProperty('storePassword')
                keyAlias = ueSigning.getProperty('keyAlias')
                keyPassword = ueSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig = ueSigning ? signingConfigs.release : signingConfigs.debug }
        debug { if (ueSigning) signingConfig = signingConfigs.release }
    }

    // The engine's CMake root, Source/: its ANDROID branches build the game as libHP2.so.
    externalNativeBuild {
        cmake {
            path = file('../../Source/CMakeLists.txt')
            version = '4.1.2+'
        }
    }

    sourceSets {
        main { java.srcDir(sdl2Java) }
    }

    buildFeatures { buildConfig = true; resValues = true }
    // The libraries extracted to the file system at install, as the manifest's extractNativeLibs says.
    packaging { jniLibs { useLegacyPackaging = true } }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    // targetSdk 34 is below what the Play store asks for; the APK is for testing on a device.
    lint { disable.add('ExpiredTargetSdkVersion') }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(hp2SystemOverlay, { it.outputDir })
    }
}
